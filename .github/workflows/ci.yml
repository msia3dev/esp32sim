name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Validate ARM execution first on the single runner, then run the full x64 suite.
    needs: native-aarch64
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
      # Node 24 LTS, not the runner image's Node 22: on 22, V8 holds the modules the WASM JIT
      # releases, and tools/wasm-jit-test.mjs grows to 4.7 GB in 210 s (on an M-series Mac; on the
      # runner 9 minutes, and out of memory once the module grows). On 24 the same run takes 0.2 GB
      # and 14 s.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Portable Python builds also support the Debian self-hosted environment.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Evidence privacy patterns
        run: node tools/check-evidence-privacy.mjs
      - name: Retained x5 receipt contracts
        run: |
          node --test docs/evidence/perf-x5-2026-09-22/verify-results.test.mjs
          node docs/evidence/perf-x5-2026-09-22/verify-results.mjs
          node --test docs/evidence/perf-x5-2026-09-22/m1-before-after/verify.test.mjs
          node docs/evidence/perf-x5-2026-09-22/m1-before-after/verify.mjs
          node --test docs/evidence/perf-x5-2026-09-22/historical-before-after/verify.test.mjs
          node docs/evidence/perf-x5-2026-09-22/historical-before-after/verify.mjs
      # Pinned by release and SHA-256 in the script, which is also the cache key: a cached roms/ is
      # re-verified and costs no download, and nothing here goes through the GitHub API.
      - uses: actions/cache@v4
        with:
          path: roms
          key: rom-elfs-${{ hashFiles('tools/fetch-rom-elfs.sh') }}
      - name: Fetch the ESP32, ESP32-S3, ESP32-C3, ESP32-C6 and ESP32-P4 mask ROM ELFs
        run: tools/fetch-rom-elfs.sh roms && ls -la roms/*.elf
      # The T-Display demo boots the official MicroPython image (MIT, micropython.org, 1.8 MB), pinned
      # by SHA-256 in the script, cached the same way.
      - uses: actions/cache@v4
        with:
          path: web/wasm/fw/ESP32_GENERIC-20260824-v1.29.0.bin
          key: micropython-${{ hashFiles('tools/fetch-micropython.sh') }}
      - name: Fetch the MicroPython ESP32_GENERIC image
        run: tools/fetch-micropython.sh
      # The ESP32-P4 example images the goldens boot and the page does not, fetched from
      # mikroverk/esp32sim-firmware and checked against the SHA-256 the script pins.
      - name: Fetch the ESP32-P4 example images
        run: tools/fetch-p4-firmware.sh
      - name: Build
        run: cargo build --release --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (WASM JIT and differential tests)
        run: cargo clippy --release --target wasm32-unknown-unknown -p esp32sim-wasm --features jit-tests -- -D warnings
      - name: Test (hermetic + golden outputs)
        run: ESP32SIM_ROM_DIR=$PWD/roms cargo test --release --workspace -- --include-ignored --skip external_
      - name: Virtual-quantum scheduler (native opt-in)
        run: ESP32SIM_VQ_NATIVE=1 cargo test --release -p esp32s3 --test machine --test virtual_stops
      - name: Build the wasm module
        run: tools/wasm-build.sh
      - name: Production WASM sections (no DWARF, profile names retained)
        run: node tools/check-wasm-sections.mjs web/wasm/esp32sim.wasm
      - name: Test the wasm module (the real build, under Node, through the page's manifests)
        run: ESP32SIM_ROM_DIR=$PWD/roms node tools/wasm-test.mjs hello c3-hello c6-hello p4-hello p4-c6-hosted p4-lcd35-synth c6-energy-scan c6-contiki c6-contiki-net c6-rpl-net panel tdisplay-prices tdisplay-schematik
      - name: Timing and BLE observation ABI (real wasm exports)
        run: |
          node wasm/tests/timing-api.mjs web/wasm/esp32sim.wasm
          node wasm/tests/ble-api.mjs web/wasm/esp32sim.wasm web/wasm/fw/public roms/esp32c3_rev3_rom.elf
          node wasm/tests/ble-connection.mjs web/wasm/esp32sim.wasm web/wasm/fw/public roms/esp32c3_rev3_rom.elf
      - name: Worker pacing, channel and experiment tests
        run: |
          node tools/worker-pacing-test.mjs
          node tools/worker-channel-test.mjs
          node --test tools/touch-input-test.mjs
          node --test tools/stopwatch-ui-test.mjs
      - name: Browser benchmark verdict, configuration and receipt tests
        run: |
          node --test tools/wasm-build-policy.test.mjs
          node --test tools/browser-benchmark/*.test.mjs
          python3 -m unittest discover -s tools/browser-benchmark -p 'test_*.py'
      - name: Differential tests for generated WASM blocks
        run: tools/wasm-jit-test.sh
      - name: Compile WASM profiling features with production flags
        run: |
          . ./tools/wasm-rustflags.sh
          cargo build --release --target wasm32-unknown-unknown -p esp32sim-wasm --features jit-profile,cpu-profile
  # Cross-compile at x64 speed, then execute the unchanged ARM64 JIT tests with
  # QEMU inside Docker. Every job stays on the self-hosted x64 runner.
  native-aarch64:
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
      - name: ARM64 Clippy, core tests and JIT goldens (Docker + QEMU)
        run: docker build --platform linux/amd64 --progress=plain --file .github/ci/aarch64.Dockerfile .
